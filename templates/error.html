<!DOCTYPE html>

<head>

</head>
<body style="display:grid;place-items:center;min-height:100vh">

    <span class="logo" style="display:inline-block"></span>
    <h1 style="font-size:42px;color:var(--primary)">{{ code }}</h1>
    <p class="muted" style="margin:8px 0 22px">{{ message }}</p>
